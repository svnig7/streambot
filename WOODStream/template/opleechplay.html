<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ғɪʟᴇ sᴛʀᴇᴀᴍ | {{file_name}}</title>
  <link rel="shortcut icon" href="https://raw.githubusercontent.com/svnig7/images/refs/heads/main/streambot.png" type="image/x-icon">
  <link rel="stylesheet" href="https://unpkg.com/sheryjs/dist/Shery.css" />
  <link rel="stylesheet" href="https://my-hero-op.github.io/Resources/data/src/style.css">
  <link rel="stylesheet" href="https://my-hero-op.github.io/Resources/data/src/plyr.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    nav {
      background-color: black;
      padding: 20px;
      text-align: center;
    }

    #heading {
      color: white;
      font-size: 28px;
      font-weight: bold;
    }

    .file-name {
      margin-top: 20px;
      color: white;
      text-align: left;
      padding-left: 20px;
    }

    .file-name h4 {
      display: inline;
      color: crimson;
    }

    .file-name p {
      display: inline;
    }
  </style>
</head>

<body>
  <nav class="bg-black py-5 flex justify-center items-center">
  <a href="https://t.me/strm_7bot" target="_blank" class="text-white text-2xl font-bold" id="heading">
    sᴛʀᴇᴀᴍ ʙᴏᴛ
  </a>
  </nav>

  <div class="outer">
    <div class="inner">
      <div class="main" id="main">
        <video id="player" class="player" src="{{file_url}}" type="video/mp4" playsinline controls width="100%"></video>

        <div class="file-name">
  <h4>ғɪʟᴇ ɴᴀᴍᴇ : </h4>
  <p>{{file_name}}</p><br>
  <h4>ғɪʟᴇ sɪᴢᴇ : </h4>
  <p>{{file_size}}</p><br>
  <h4>ᴅᴏᴡɴʟᴏᴀᴅ :</h4>
  <a href="{{file_url}}" download="{{file_name}}" class="text-blue-400 hover:underline">
    ᴄʟɪᴄᴋ ʜᴇʀᴇ
  </a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.155.0/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/automat/controlkit.js@master/bin/controlKit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sheryjs/dist/Shery.js"></script>
  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
  <script src="https://my-hero-op.github.io/Resources/data/src/script.js"></script>
</body>

</html>
